[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyeilik"
version = "0.1.0"
description = "Pure-Python Linux driver for the Energize Lab Eilik desktop robot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
eilik-probe = "probe:main"

[tool.setuptools]
packages = ["eilik"]
py-modules = ["probe"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names and their docstrings describe intent well enough on their own; a
# mandated docstring on every `test_*` method is noise.
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::eilik.errors.ServoRangeWarning"]
